# Keep Kitty visually consistent with the existing Alacritty setup.
# Native graphics support remains available; the extra terminal UI stays hidden.

font_family      JetBrains Mono Nerd Font
font_size        6.5

foreground       #c4c7d1
background       #161925
color0           #282c34
color1           #ed254d
color2           #71f79f
color3           #f9dc5c
color4           #7cb7ff
color5           #c74ded
color6           #00c1e4
color7           #dcdfe4
color8           #282c34
color9           #ed254d
color10          #71f79f
color11          #f9dc5c
color12          #7cb7ff
color13          #c74ded
color14          #00c1e4
color15          #dcdfe4

background_opacity 0.7
# Kitty only applies background_opacity to its own default background. Ovim's
# TokyoNight Normal highlight uses #1a1b26, so include it explicitly.
transparent_background_colors #1a1b26@0.7
window_padding_width 2
initial_window_width  135c
initial_window_height 35c

# Preserve the fixed-title treatment while identifying the primary terminal
# correctly to the window manager and compositor.
class kitty
name kitty
title Kitty@Garuda
dynamic_title no

# No Kitty chrome: Awesome is responsible for managing windows and layouts.
tab_bar_style hidden
enabled_layouts tall

# Let the window manager close Kitty immediately, even when a program is active.
confirm_os_window_close 0

# Suppress the terminal bell emitted by shell completion and other programs.
enable_audio_bell no
